name: Osher smoke-free push tick

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osher-push-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger due notifications
        env:
          SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITES_BYPASS_TOKEN"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --request POST \
            --header "OAI-Sites-Authorization: Bearer $SITES_BYPASS_TOKEN" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            'https://osher-smokefree.meiren.chatgpt.site/api/tick'
